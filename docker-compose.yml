# Production docker-compose: Postgres, Redis, Workers Platform App
# Usage: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: workers-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-workers_platform}
    # Expose to host only for debugging: uncomment and firewall.
    # ports:
    #   - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - workers-network

  redis:
    image: redis:7-alpine
    container_name: workers-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    # Expose to host only for debugging: uncomment and firewall.
    # ports:
    #   - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - workers-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workers-app
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-workers_platform}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - SECRETS_MASTER_KEY=${SECRETS_MASTER_KEY}
      - API_KEY=${API_KEY}
      - DOMAIN=${DOMAIN}
      - BLUE_PORT=3100
      - GREEN_PORT=3200
      - DATA_DIR=/data
      - EGRESS_ALLOWED_DOMAINS=${EGRESS_ALLOWED_DOMAINS}
      - INGRESS_RATE_LIMIT_PER_MINUTE=${INGRESS_RATE_LIMIT_PER_MINUTE:-300}
      - INGRESS_RATE_LIMIT_BURST=${INGRESS_RATE_LIMIT_BURST:-50}
      - MAX_BODY_BYTES=${MAX_BODY_BYTES:-10485760}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - METRICS_TOKEN=${METRICS_TOKEN}
      - EGRESS_TIMEOUT_MS=${EGRESS_TIMEOUT_MS:-120000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RUNTIME_LOG_LEVEL=${RUNTIME_LOG_LEVEL:-warn}
      - SERVICE_NAME=workers-platform
    ports:
      - "${APP_HOST_PORT:-3000}:3000"
    volumes:
      - workers-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - workers-network
    restart: unless-stopped

  # Blue/Green deployment slots (managed by deploy/production.sh).
  # Internal app port is always 3000; each slot publishes its host port
  # (BLUE_PORT/GREEN_PORT) on loopback for host nginx to proxy to.
  app-blue:
    profiles: ["blue-green"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workers-app-blue
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-workers_platform}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - SECRETS_MASTER_KEY=${SECRETS_MASTER_KEY}
      - API_KEY=${API_KEY}
      - DOMAIN=${DOMAIN}
      - BLUE_PORT=${BLUE_PORT:-3100}
      - GREEN_PORT=${GREEN_PORT:-3200}
      - DATA_DIR=/data
      - EGRESS_ALLOWED_DOMAINS=${EGRESS_ALLOWED_DOMAINS}
      - INGRESS_RATE_LIMIT_PER_MINUTE=${INGRESS_RATE_LIMIT_PER_MINUTE:-300}
      - INGRESS_RATE_LIMIT_BURST=${INGRESS_RATE_LIMIT_BURST:-50}
      - MAX_BODY_BYTES=${MAX_BODY_BYTES:-10485760}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - METRICS_TOKEN=${METRICS_TOKEN}
      - EGRESS_TIMEOUT_MS=${EGRESS_TIMEOUT_MS:-120000}
      - API_RATE_LIMIT_PER_MINUTE=${API_RATE_LIMIT_PER_MINUTE:-600}
      - API_RATE_LIMIT_BURST=${API_RATE_LIMIT_BURST:-100}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RUNTIME_LOG_LEVEL=${RUNTIME_LOG_LEVEL:-warn}
      - SERVICE_NAME=workers-platform
    ports:
      - "127.0.0.1:${BLUE_PORT:-3100}:3000"
    volumes:
      - workers-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - workers-network
    restart: unless-stopped

  app-green:
    profiles: ["blue-green"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workers-app-green
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-workers_platform}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - SECRETS_MASTER_KEY=${SECRETS_MASTER_KEY}
      - API_KEY=${API_KEY}
      - DOMAIN=${DOMAIN}
      - BLUE_PORT=${BLUE_PORT:-3100}
      - GREEN_PORT=${GREEN_PORT:-3200}
      - DATA_DIR=/data
      - EGRESS_ALLOWED_DOMAINS=${EGRESS_ALLOWED_DOMAINS}
      - INGRESS_RATE_LIMIT_PER_MINUTE=${INGRESS_RATE_LIMIT_PER_MINUTE:-300}
      - INGRESS_RATE_LIMIT_BURST=${INGRESS_RATE_LIMIT_BURST:-50}
      - MAX_BODY_BYTES=${MAX_BODY_BYTES:-10485760}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - METRICS_TOKEN=${METRICS_TOKEN}
      - EGRESS_TIMEOUT_MS=${EGRESS_TIMEOUT_MS:-120000}
      - API_RATE_LIMIT_PER_MINUTE=${API_RATE_LIMIT_PER_MINUTE:-600}
      - API_RATE_LIMIT_BURST=${API_RATE_LIMIT_BURST:-100}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RUNTIME_LOG_LEVEL=${RUNTIME_LOG_LEVEL:-warn}
      - SERVICE_NAME=workers-platform
    ports:
      - "127.0.0.1:${GREEN_PORT:-3200}:3000"
    volumes:
      - workers-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - workers-network
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  workers-data:

networks:
  workers-network:
    driver: bridge