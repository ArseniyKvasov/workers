# Production docker-compose: Postgres, Redis, Workers Platform App
# Usage: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: workers-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-workers_platform}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - workers-network

  redis:
    image: redis:7-alpine
    container_name: workers-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - workers-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workers-app
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-workers_platform}
      - REDIS_URL=redis://redis:6379
      - SECRETS_MASTER_KEY=${SECRETS_MASTER_KEY}
      - API_KEY=${API_KEY}
      - DOMAIN=${DOMAIN}
      - BLUE_PORT=3100
      - GREEN_PORT=3200
      - DATA_DIR=/data
      - EGRESS_ALLOWED_DOMAINS=${EGRESS_ALLOWED_DOMAINS}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RUNTIME_LOG_LEVEL=${RUNTIME_LOG_LEVEL:-warn}
      - SERVICE_NAME=workers-platform
    ports:
      - "${APP_HOST_PORT:-3000}:3000"
    volumes:
      - workers-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - workers-network
    restart: unless-stopped

  # Blue/Green deployment slots (managed by deploy/production.sh)
  app-blue:
    profiles: ["blue-green"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workers-app-blue
    environment:
      - NODE_ENV=production
      - PORT=3100
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-workers_platform}
      - REDIS_URL=redis://redis:6379
      - SECRETS_MASTER_KEY=${SECRETS_MASTER_KEY}
      - API_KEY=${API_KEY}
      - DOMAIN=${DOMAIN}
      - BLUE_PORT=3100
      - GREEN_PORT=3200
      - DATA_DIR=/data
      - EGRESS_ALLOWED_DOMAINS=${EGRESS_ALLOWED_DOMAINS}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RUNTIME_LOG_LEVEL=${RUNTIME_LOG_LEVEL:-warn}
      - SERVICE_NAME=workers-platform
    volumes:
      - workers-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - workers-network
    restart: unless-stopped

  app-green:
    profiles: ["blue-green"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workers-app-green
    environment:
      - NODE_ENV=production
      - PORT=3200
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-workers_platform}
      - REDIS_URL=redis://redis:6379
      - SECRETS_MASTER_KEY=${SECRETS_MASTER_KEY}
      - API_KEY=${API_KEY}
      - DOMAIN=${DOMAIN}
      - BLUE_PORT=3100
      - GREEN_PORT=3200
      - DATA_DIR=/data
      - EGRESS_ALLOWED_DOMAINS=${EGRESS_ALLOWED_DOMAINS}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RUNTIME_LOG_LEVEL=${RUNTIME_LOG_LEVEL:-warn}
      - SERVICE_NAME=workers-platform
    volumes:
      - workers-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - workers-network
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  workers-data:

networks:
  workers-network:
    driver: bridge